apiVersion: apps/v1
kind: Deployment
metadata:
  name: tictactoe
  labels:
    app: tictactoe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tictactoe
  template:
    metadata:
      labels:
        app: tictactoe
    spec:
      containers:
      - name: tictactoe
        # Replace <account-id> with your AWS account ID after pushing to ECR
        image: 531988093830.dkr.ecr.us-east-1.amazonaws.com/tictactoe:latest
        ports:
        - containerPort: 6080
        readinessProbe:
          httpGet:
            path: /
            port: 6080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 6080
          initialDelaySeconds: 15
          periodSeconds: 20
